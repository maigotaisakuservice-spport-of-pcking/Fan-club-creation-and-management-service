<body>
    <header> <!-- ... (変更なし) ... --> </header>
    <main id="club-page">
        <!-- 公開エリア -->
        <section id="public-area">
            <h2 id="club-name">読み込み中...</h2>
            <div id="public-contents-container">
                <!-- ↓JavaScriptによって並べ替えられるブロック↓ -->
                <div data-block-id="announcement">
                    <h3>お知らせ</h3>
                    <p>会員になると、限定動画や掲示板を閲覧できます！</p>
                </div>
                <div data-block-id="goods">
                    <h3>グッズ販売</h3>
                    <a href="#" id="goods-link" target="_blank">グッズページはこちら</a>
                </div>
            </div>
            <button id="action-button">読み込み中...</button>
        </section>

        <!-- 会員限定エリア -->
        <section id="member-area" style="display: none;">
            <h2>会員限定エリア</h2>
            <div id="member-contents-container">
                <!-- ↓JavaScriptによって並べ替えられるブロック↓ -->
                <div data-block-id="video">
                    <h3>限定動画</h3>
                    <div id="video-container"></div>
                </div>
                <div data-block-id="posts">
                    <h3>限定掲示板</h3>
                    <div id="posts-container"></div>
                </div>
                <div data-block-id="fan-board">
                    <h3>ファン交流掲示板</h3>
                    <p>（この機能は現在開発中です）</p>
                </div>
            </div>
            <button id="show-public-area-button">公開エリアへ戻る</button>
        </section>
