<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードリセット - FanCru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><a href="index.html">FanCru</a></h1>
    </header>

    <main>
        <div id="auth-form-container">
            <h2>パスワードリセット</h2>
            <p>ご登録のメールアドレスを入力してください。パスワードリセット用のリンクを送信します。</p>
            <form id="password-reset-form">
                <input type="email" id="reset-email" placeholder="メールアドレス" required>
                <button type="submit">リセットメールを送信</button>
            </form>
            <p class="auth-switch">
                <a href="login.html">ログインページへ戻る</a>
            </p>
        </div>
    </main>

    <footer>
        <p>© 2025 TekipakiPC</p>
    </footer>

    <script type="module" src="firebase-init.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
